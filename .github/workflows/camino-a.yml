name: Camino A

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  camino-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install -r requirements.txt
      - name: Mock y mentiras
        run: python scripts/check_erp.py
      - name: Tests
        run: python -m unittest discover -s tests -v
